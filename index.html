<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest">
<title>かけ算アプリ</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;font-family:system-ui,sans-serif;background:#f5f7fb;display:grid;place-items:center}
.app{width:min(440px,100%);background:white;border-radius:20px;padding:28px;box-shadow:0 12px 32px #0002}
h1{text-align:center;margin:0 0 20px}label{display:block;font-weight:700;margin:14px 0 6px}
input{width:100%;font-size:24px;padding:14px;border:1px solid #bbb;border-radius:12px}
button{width:100%;margin-top:20px;padding:14px;font-size:20px;font-weight:700;border:0;border-radius:12px;background:#111827;color:white}
#result{margin-top:22px;padding:12px;text-align:center;font-size:30px;font-weight:800;background:#f1f5f9;border-radius:12px}
</style></head><body><main class="app">
<h1>🐥 かけ算アプリ</h1>
<label>1つ目の数字</label><input id="a" type="number" inputmode="decimal" step="any">
<label>2つ目の数字</label><input id="b" type="number" inputmode="decimal" step="any">
<label>3つ目の数字</label><input id="c" type="number" inputmode="decimal" step="any">
<button onclick="calc()">計算する</button><div id="result">答え：---</div>
</main><script>
function calc(){const x=parseFloat(a.value),y=parseFloat(b.value),z=parseFloat(c.value);
result.textContent=[x,y,z].some(Number.isNaN)?'数字を3つ入れてね':'答え：'+(x*y*z)}
document.addEventListener('keydown',e=>{if(e.key==='Enter')calc()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js');
</script></body></html>
