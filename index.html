<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>かけ算アプリ</title>
<style>*{box-sizing:border-box}body{font-family:system-ui;background:#f5f7fb;margin:0;padding:24px;display:grid;place-items:center;min-height:100vh}.app{background:white;padding:28px;border-radius:20px;width:min(440px,100%);box-shadow:0 12px 32px #0002}h1{text-align:center}label{display:block;font-weight:bold;margin:12px 0 5px}input{width:100%;font-size:24px;padding:13px;border:1px solid #bbb;border-radius:12px}button{width:100%;padding:14px;margin-top:18px;font-size:20px;font-weight:bold;border:0;border-radius:12px;background:#111827;color:white}.ans{display:flex;align-items:center;gap:12px;margin-top:24px}.bird{font-size:64px}.bubble{position:relative;flex:1;background:#eef6fb;border:2px solid #cadde9;border-radius:20px;padding:18px 12px;text-align:center;font-size:25px;font-weight:bold}.bubble:before{content:"";position:absolute;left:-14px;top:30px;border-width:10px 14px 10px 0;border-style:solid;border-color:transparent #cadde9 transparent transparent}</style></head>
<body><main class="app"><h1>🐥 かけ算アプリ</h1>
<label>1つ目の数字</label><input id="a" type="number">
<label>2つ目の数字</label><input id="b" type="number">
<label>3つ目の数字</label><input id="c" type="number">
<button onclick="calc()">計算する</button>
<div class="ans"><div class="bird">🐦</div><div id="r" class="bubble">数字を入れてぴよ♪</div></div>
<script>function calc(){let x=+a.value,y=+b.value,z=+c.value;r.textContent=(a.value===""||b.value===""||c.value==="")?"3つとも入れてぴよ！":"答えは "+(x*y*z)+" だぴよ！"}</script>
</main></body></html>
