<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <title>かけ算アプリ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .app {
      width: min(440px, 100%);
      background: #fff;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 12px 32px rgba(0,0,0,.12);
    }
    h1 {
      margin: 0 0 20px;
      text-align: center;
      font-size: 28px;
    }
    label {
      display: block;
      font-weight: 700;
      margin: 14px 0 6px;
    }
    input {
      width: 100%;
      font-size: 24px;
      padding: 14px;
      border: 1px solid #c7cbd1;
      border-radius: 12px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      font-size: 20px;
      font-weight: 700;
      border: 0;
      border-radius: 12px;
      background: #111827;
      color: #fff;
    }
    .result {
      min-height: 54px;
      margin-top: 22px;
      display: grid;
      place-items: center;
      font-size: 30px;
      font-weight: 800;
      background: #f1f5f9;
      border-radius: 12px;
      padding: 10px;
    }
    .hint {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.6;
      color: #667085;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>🐥 かけ算アプリ</h1>

    <label for="a">1つ目の数字</label>
    <input id="a" type="number" inputmode="decimal" step="any">

    <label for="b">2つ目の数字</label>
    <input id="b" type="number" inputmode="decimal" step="any">

    <button id="calc">計算する</button>

    <div id="result" class="result">答え：---</div>
    <div class="hint">ホーム画面に追加すると、アプリのように起動できます。</div>
  </main>

  <script>
    const a = document.getElementById('a');
    const b = document.getElementById('b');
    const result = document.getElementById('result');

    function calculate() {
      const x = parseFloat(a.value);
      const y = parseFloat(b.value);

      if (Number.isNaN(x) || Number.isNaN(y)) {
        result.textContent = '数字を2つ入れてね';
        return;
      }
      result.textContent = '答え：' + (x * y);
    }

    document.getElementById('calc').addEventListener('click', calculate);
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') calculate();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js');
      });
    }
  </script>
</body>
</html>
